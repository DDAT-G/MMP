<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Mood Playlist - Front Test</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="playlist navigation">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">M</div>
          <div class="brand-text">
            <strong>My Mood</strong>
            <span>Playlist</span>
          </div>
        </div>
      </div>
      <nav class="nav-list" aria-label="main menu">
        <div class="nav-section-title">내 리스트</div>
        <div id="savedPlaylistsContainer" class="saved-playlists-list"></div>
      </nav>
      <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Toggle Sidebar">
        <span>‹</span>
      </button>
    </aside>

    <main class="content">
      <section class="hero">
        <div class="hero-copy">
          <h1>오늘은 이런 노래 어때요?</h1>
          <span class="eyebrow">Mood based streaming</span>
          <p>자신이 좋아하는 아티스트나 현재 듣고싶은 음악의 장르를 선택, 입력하면 분석후 알맞는 노래 목록을 출력 해드립니다.</p>
        </div>
        <article class="recommendation-card">
          <span class="eyebrow">Discovery</span>
          <div class="recommendation-content">
            <p>어떤 곡을 들을지 고민된다면?</p>
            <button class="primary-button" id="randomButton" type="button">🎲 랜덤으로 추천 받기</button>
          </div>
          <div class="chips" aria-label="quick mood filters">
            <button type="button" data-mood="집중">집중</button>
            <button type="button" data-mood="휴식">휴식</button>
            <button type="button" data-mood="드라이브">드라이브</button>
            <button type="button" data-mood="밤">밤</button>
          </div>
        </article>
      </section>

      <section class="dual-grid">
        <form class="search-card" id="moodForm">
          <label for="moodInput">노래 검색</label>
          <div class="search-row">
            <input id="moodInput" name="mood" type="search" placeholder="아티스트나 장르 등 키워드를 입력하세요." autocomplete="off" />
            <button class="primary-button" type="submit">검색</button>
          </div>
          <div class="duration-settings">
            <div class="duration-header">
              <label>영상 길이 (분)</label>
              <span class="range-values"><span id="minVal">1</span>분 ~ <span id="maxVal">120</span>분</span>
            </div>
            <div class="multi-range-slider">
              <input type="range" id="minDurationInput" min="1" max="120" value="1" />
              <input type="range" id="maxDurationInput" min="1" max="120" value="120" />
              <div class="slider-track"></div>
            </div>
          </div>
        </form>
        <div class="status-card setting-card">
          <label for="trackCountInput">트랙 수 설정</label>
          <input type="number" id="trackCountInput" value="8" min="1" max="50" />
        </div>
      </section>

      <section class="section-header">
        <div>
          <h2 id="playlistTitle">플레이리스트</h2>
          <span class="eyebrow">추천</span>
        </div>
        <div class="header-actions">
          <button class="ghost-button" id="mainSaveButton" type="button" disabled>
            <span>💾</span> 리스트 저장하기
          </button>
          <button class="play-selected-button" id="playSelectedButton" type="button" disabled>
            <span>▶</span> 선택된 리스트 재생하기
          </button>
          <button class="ghost-button" id="reloadButton" type="button">다시 불러오기</button>
        </div>
      </section>

      <section class="track-list" id="trackList" aria-live="polite"></section>
    </main>
  </div>

  <div class="expanded-player" id="expandedPlayer">
    <div class="expanded-header">
      <div style="width: 40px;"></div>
      <div class="expanded-now-playing">
        <strong id="expandedTitle">곡 제목</strong>
        <span id="expandedArtist">아티스트</span>
      </div>
      <button class="expand-close" id="closeExpandedPlayer" title="닫기">▼</button>
    </div>

    <div class="expanded-body">
      <div class="expanded-video-side">
        <div class="video-container">
          <iframe id="videoPlayer" src="" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen></iframe>
        </div>
      </div>
      <div class="expanded-list-side">
        <div class="side-tabs">
          <button class="side-tab-button active" data-tab="queue">다음 트랙</button>
          <button class="side-tab-button" data-tab="playlists">내 리스트</button>
        </div>
        <div class="side-content active" id="expandedQueueList"></div>
        <div class="side-content" id="expandedPlaylistsList"></div>
      </div>
    </div>
  </div>

  <footer class="player" id="playerBar" aria-label="global player">
    <div class="player-left">
      <img id="playerCover" src="" alt="" />
      <div class="player-copy">
        <span id="playerTitle">곡을 선택하세요</span>
        <small id="playerArtist">목 데이터로 재생 UI만 확인</small>
      </div>
    </div>

    <div class="player-center">
      <div class="control-buttons">
        <button type="button" aria-label="previous">‹</button>
        <button class="play-button" type="button" aria-label="play">▶</button>
        <button type="button" aria-label="next">›</button>
      </div>
      <div class="progress-container">
        <span>0:00</span>
        <div class="progress-bar">
          <div></div>
        </div>
        <span>3:45</span>
      </div>
    </div>

    <div class="player-right">
      <button id="watchVideoButton" class="icon-button" type="button" aria-label="Watch Video" title="영상 보기">▲</button>
      <div class="volume-control">
        <button id="volumeButton" type="button" aria-label="volume">🔈</button>
        <input type="range" id="volumeSlider" min="0" max="100" value="80" />
      </div>
      <button class="playlist-toggle-button" id="playlistToggle" type="button" aria-label="선택된 리스트 보기">
        <span>≡</span>
      </button>
    </div>

    <section class="playlist-drawer" id="playlistDrawer">
      <div class="drawer-header">
        <h3>선택된 재생 목록</h3>
        <div class="drawer-actions">
          <button id="savePlaylistButton" class="text-button" type="button">저장</button>
          <button id="closeDrawer" type="button">✕</button>
        </div>
      </div>
      <div class="drawer-content" id="selectedTrackList"></div>
    </section>
  </footer>

  <script src="./app.js"></script>
</body>

</html>
